# ==============================================================================
# Declarative GitOps Secrets (Local Development & Bootstrap Defaults)
# ==============================================================================
#
# ⚠️ PRODUCTION GITOPS NOTICE:
# This manifest provides safe default development credentials so that
# 'kubectl apply -f deploy/kubernetes/argocd/app-of-apps.yaml' succeeds out
# of the box without encountering CreateContainerConfigError.
#
# FOR PRODUCTION DEPLOYMENTS, USE ONE OF THE FOLLOWING PATTERNS:
#
# 1. Bitnami Sealed Secrets:
#    - Install the Sealed Secrets controller in the cluster.
#    - Encrypt sensitive values using kubeseal:
#        kubeseal --controller-namespace kube-system --format yaml < secret.yaml > sealed-secret.yaml
#    - Commit the generated SealedSecret CRD to Git (safe for public/private repos).
#
# 2. External Secrets Operator (ESO):
#    - Deploy External Secrets Operator (https://external-secrets.io).
#    - Configure a SecretStore / ClusterSecretStore pointing to AWS Secrets Manager,
#      HashiCorp Vault, Azure Key Vault, or GCP Secret Manager.
#    - Define an ExternalSecret resource that automatically synchronizes the secret
#      from your cloud vault into Kubernetes Secret 'grafana-admin-credentials'
#      and 'alertmanager-secrets'.
#
# 3. ArgoCD Sync Waves:
#    - These secrets are annotated with 'argocd.argoproj.io/sync-wave: "-1"'
#      to guarantee they are created BEFORE Grafana and Alertmanager pods deploy.
#
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kube-prometheus-stack
    tier: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "prom-operator-admin"

---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secrets
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: kube-prometheus-stack
    tier: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  slack-webhook-url: "https://hooks.slack.com/services/DUMMY/WEBHOOK/URL"
  pagerduty-routing-key: "dummy-pagerduty-routing-key-placeholder"
