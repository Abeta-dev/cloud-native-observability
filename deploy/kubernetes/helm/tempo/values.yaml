# Production Values for Grafana Tempo Distributed Tracing (tempo-distributed chart)
fullnameOverride: "tempo"

traces:
  otlp:
    grpc:
      enabled: true
    http:
      enabled: true

storage:
  trace:
    backend: s3
    s3:
      bucket: cno-tempo-traces-prod
      endpoint: s3.us-east-1.amazonaws.com
      region: us-east-1
      insecure: false
    wal:
      path: /var/tempo/wal

distributor:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

ingester:
  replicas: 3
  config:
    trace_idle_period: 10s
    max_block_bytes: 50000000
    max_block_duration: 30m
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
    limits:
      cpu: 2000m
      memory: 8Gi

compactor:
  replicas: 1
  config:
    compaction:
      compaction_window: 1h
      max_block_bytes: 500000000
      block_retention: 720h # 30 days retention
      compacted_block_retention: 2h
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi

querier:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi

queryFrontend:
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
