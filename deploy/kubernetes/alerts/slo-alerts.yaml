apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-error-budget-alerts
  namespace: monitoring
  labels:
    role: alert-rules
    release: kube-prometheus-stack
spec:
  groups:
    - name: slo.availability.recording
      rules:
        # -------------------------------------------------------------------------
        # Precomputed Error Rates across SLO Windows (avoid expensive TSDB queries)
        # -------------------------------------------------------------------------
        - record: job:http_requests:error_rate_5m
          expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service, namespace) / sum(rate(http_requests_total[5m])) by (service, namespace)
        - record: job:http_requests:error_rate_30m
          expr: sum(rate(http_requests_total{status=~"5.."}[30m])) by (service, namespace) / sum(rate(http_requests_total[30m])) by (service, namespace)
        - record: job:http_requests:error_rate_1h
          expr: sum(rate(http_requests_total{status=~"5.."}[1h])) by (service, namespace) / sum(rate(http_requests_total[1h])) by (service, namespace)
        - record: job:http_requests:error_rate_6h
          expr: sum(rate(http_requests_total{status=~"5.."}[6h])) by (service, namespace) / sum(rate(http_requests_total[6h])) by (service, namespace)
        - record: job:http_requests:error_rate_3d
          expr: sum(rate(http_requests_total{status=~"5.."}[3d])) by (service, namespace) / sum(rate(http_requests_total[3d])) by (service, namespace)

    - name: slo.availability.burnrate
      rules:
        # -------------------------------------------------------------------------
        # Google SRE Multiwindow Multi-Burn-Rate Alerts for 99.9% Availability SLO
        # -------------------------------------------------------------------------
        # Window 1: 14.4x burn rate over 1h AND 5m (Burns 2% budget in 1h) -> Page
        - alert: ServiceErrorBudgetBurnRateHigh1h
          expr: |
            (
              job:http_requests:error_rate_1h > (1 - 0.999) * 14.4
            )
            and
            (
              job:http_requests:error_rate_5m > (1 - 0.999) * 14.4
            )
          for: 2m
          labels:
            severity: critical
            tier: slo
          annotations:
            summary: "Critical 1h Error Budget Burn Rate (14.4x)"
            description: "Service is burning error budget at 14.4x over 1 hour and 5 minutes (2% of monthly budget consumed in 1 hour). Requires immediate intervention."
            runbook_url: "https://github.com/Abeta-dev/cloud-native-observability/blob/main/docs/RUNBOOKS.md#serviceerrorbudgetburnratehigh1h"

        # Window 2: 6x burn rate over 6h AND 30m (Burns 5% budget in 6h) -> Page
        - alert: ServiceErrorBudgetBurnRateHigh6h
          expr: |
            (
              job:http_requests:error_rate_6h > (1 - 0.999) * 6
            )
            and
            (
              job:http_requests:error_rate_30m > (1 - 0.999) * 6
            )
          for: 15m
          labels:
            severity: critical
            tier: slo
          annotations:
            summary: "High 6h Error Budget Burn Rate (6x)"
            description: "Service is burning error budget at 6x over 6 hours (5% of monthly budget consumed in 6 hours)."
            runbook_url: "https://github.com/Abeta-dev/cloud-native-observability/blob/main/docs/RUNBOOKS.md#serviceerrorbudgetburnratehigh6h"

        # Window 3: 1x burn rate over 3d AND 6h (Burns 10% budget in 3d)
        - alert: ServiceErrorBudgetBurnRateSlow3d
          expr: |
            (
              job:http_requests:error_rate_3d > (1 - 0.999) * 1
            )
            and
            (
              job:http_requests:error_rate_6h > (1 - 0.999) * 1
            )
          for: 3h
          labels:
            severity: warning
            tier: slo
          annotations:
            summary: "Slow 3-day Error Budget Burn Rate (1x)"
            description: "Service is steadily consuming error budget over a 3-day window and 6-hour window. Create tracking ticket for service owners."
            runbook_url: "https://github.com/Abeta-dev/cloud-native-observability/blob/main/docs/RUNBOOKS.md#serviceerrorbudgetburnrateslow3d"
