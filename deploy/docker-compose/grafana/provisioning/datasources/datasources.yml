apiVersion: 1

datasources:
  # 1. Prometheus Metrics Engine
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 5s
    editable: false

  # 2. Loki Centralized Log Aggregator (with Trace-to-Log derivation)
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      derivedFields:
        # Automatically detects trace_id in log lines and provides 1-click jump to Tempo trace
        - datasourceUid: tempo
          matcherRegex: "(?:trace_id|traceId|traceID)[\"':= ]+([a-f0-9]+)"
          name: TraceID
          url: "$${__value.raw}"
    editable: false

  # 3. Tempo Distributed Tracing (with Log and Metric correlations)
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      # 1-Click jump from any trace span to Loki logs for the same service and timeframe
      tracesToLogs:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        mapTagNamesEnabled: true
        tags:
          - key: service.name
            value: app
      # Service Graph metrics correlation with Prometheus
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
    editable: false
