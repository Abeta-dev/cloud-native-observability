# ==============================================================================
# Docker Compose Overlay: Prometheus Remote-Write to Clustered Storage
# ==============================================================================
# Target: deploy/docker-compose/mimir-remote-write.yaml
#
# PURPOSE:
# Demonstrates remote-writing metrics from local Prometheus to an external or
# clustered Grafana Mimir / Thanos Receive backend in development environments.
#
# USAGE:
#   # From repository root:
#   docker compose -f deploy/docker-compose/docker-compose.yml \
#                  -f deploy/docker-compose/mimir-remote-write.yaml up -d
#
#   # From deploy/docker-compose directory:
#   docker compose -f docker-compose.yml \
#                  -f mimir-remote-write.yaml up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Prometheus Service Extension with Remote-Write Enabled
  # ----------------------------------------------------------------------------
  prometheus:
    volumes:
      - ./prometheus/prometheus.remote-write.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    environment:
      - REMOTE_WRITE_ENABLED=true
      - MIMIR_ENDPOINT=http://mimir-distributor.monitoring.svc:8080/api/v1/push
      - MIMIR_TENANT_ID=cno-tenant-dev
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
      - "--enable-feature=remote-write-receiver"
