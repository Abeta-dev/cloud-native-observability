services:
  # 1. Prometheus - Metrics Scrape & Storage Engine
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: cno-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cno-network

  # 2. Loki - Centralized Log Aggregator
  loki:
    image: grafana/loki:3.0.0
    container_name: cno-loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cno-network

  # 3. Tempo - Distributed Tracing Backend
  tempo:
    image: grafana/tempo:2.4.1
    container_name: cno-tempo
    ports:
      - "3200:3200" # Tempo HTTP
      - "4317:4317" # OTLP gRPC receiver
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo.yaml:ro
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cno-network

  # 4. OpenTelemetry Collector - Unified Telemetry Gateway
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: cno-otel-collector
    ports:
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter
      - "8888:8888" # Internal collector metrics
      - "13133:13133" # Health check extension
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    restart: unless-stopped
    depends_on:
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - cno-network

  # 5. Grafana - Single Pane of Glass Visualization & Correlation
  grafana:
    image: grafana/grafana:10.4.0
    container_name: cno-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || curl -s -f http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    networks:
      - cno-network

  # 6. Alertmanager - Alert Routing, Deduplication & Notification Engine
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: cno-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../kubernetes/alerts/alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cno-network

  # 7. Demo Application - Reference Microservice Telemetry Producer
  demo-app:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    container_name: cno-demo-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - cno-network

  # 8. Synthetic Traffic Generator - Real-time Data Simulator
  traffic-generator:
    image: curlimages/curl:8.6.0
    container_name: cno-traffic-generator
    volumes:
      - ./traffic-generator/traffic.sh:/traffic.sh:ro
    entrypoint: ["/bin/sh", "/traffic.sh"]
    environment:
      - TARGET_HOST=http://demo-app:8080
      - SLEEP_INTERVAL=1
    restart: unless-stopped
    depends_on:
      demo-app:
        condition: service_healthy
    networks:
      - cno-network

networks:
  cno-network:
    name: cloud-native-observability-net
    driver: bridge
