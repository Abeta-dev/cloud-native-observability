name: Observability Platform CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "chore/**"
      - "release/**"
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Detect Changed Paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            code:
              - 'deploy/**'
              - 'scripts/**'
              - 'Makefile'
              - 'Dockerfile*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  docs-match-tree:
    name: Validate Docs & Version Synchronization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Version & Documentation Synchronization
        run: ./scripts/check_version.sh

  validate-configs:
    name: Validate Observability Manifests, Alerts & IaC
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install promtool and amtool
        run: |
          PROM_VERSION="2.51.0"
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" | tar -xz -C /tmp
          echo "/tmp/prometheus-${PROM_VERSION}.linux-amd64" >> $GITHUB_PATH

          AM_VERSION="0.27.0"
          curl -fsSL "https://github.com/prometheus/alertmanager/releases/download/v${AM_VERSION}/alertmanager-${AM_VERSION}.linux-amd64.tar.gz" | tar -xz -C /tmp
          echo "/tmp/alertmanager-${AM_VERSION}.linux-amd64" >> $GITHUB_PATH

      - name: Validate Prometheus Alert Rules with Promtool
        run: |
          if command -v promtool >/dev/null 2>&1; then
            echo "Validating Docker Compose Prometheus alert rules..."
            promtool check rules deploy/docker-compose/prometheus/alerts.yml
            echo "Validating Kubernetes PrometheusRule alerts (slo-alerts)..."
            sed -n '/^spec:/,$p' deploy/kubernetes/alerts/slo-alerts.yaml | sed '1d' | sed 's/^  //' | promtool check rules /dev/stdin
            echo "Validating Kubernetes PrometheusRule alerts (k8s-node-alerts)..."
            sed -n '/^spec:/,$p' deploy/kubernetes/alerts/k8s-node-alerts.yaml | sed '1d' | sed 's/^  //' | promtool check rules /dev/stdin
          else
            echo "promtool not available, skipping rules check"
          fi

      - name: Run Promtool Unit Tests for Alert Rules
        run: |
          if command -v promtool >/dev/null 2>&1; then
            echo "Running Promtool alert rules unit test suites..."
            bash ./scripts/test_alerts.sh
          else
            echo "promtool not available, skipping rules unit tests"
          fi

      - name: Validate Alertmanager Configuration
        run: |
          echo "Validating Alertmanager configuration with amtool..."
          amtool check-config deploy/kubernetes/alerts/alertmanager.yaml

      - name: Validate Prometheus Server Config
        run: |
          if command -v promtool >/dev/null 2>&1; then
            echo "Validating Prometheus scrape configuration..."
            promtool check config deploy/docker-compose/prometheus/prometheus.yml
          else
            echo "promtool not available, skipping config check"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.5

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.51.1

      - name: Validate Terraform Formatting and Syntax
        run: |
          echo "Checking Terraform formatting..."
          terraform -chdir=deploy/terraform fmt -check -recursive
          echo "Validating Terraform modules and syntax..."
          terraform -chdir=deploy/terraform init -backend=false
          terraform -chdir=deploy/terraform validate

      - name: Lint Terraform with TFLint
        run: |
          echo "Running TFLint..."
          cd deploy/terraform
          tflint --init
          tflint --recursive

      - name: Install Kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.4"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C /tmp
          echo "/tmp" >> $GITHUB_PATH

      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.14.2

      - name: Lint Helm Configurations
        run: |
          echo "Validating Helm configurations..."
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update
          helm template test-kps prometheus-community/kube-prometheus-stack --version 58.7.1 -f deploy/kubernetes/helm/kube-prometheus-stack/values-base.yaml | kubeconform -strict -ignore-missing-schemas
          helm template test-tempo grafana/tempo-distributed --version 1.9.1 -f deploy/kubernetes/helm/tempo/values.yaml | kubeconform -strict -ignore-missing-schemas
          helm template test-loki grafana/loki --version 5.43.3 -f deploy/kubernetes/helm/loki/values.yaml | kubeconform -strict -ignore-missing-schemas
          helm template test-otel open-telemetry/opentelemetry-collector --version 0.88.0 -f deploy/kubernetes/helm/otel-collector/values.yaml | kubeconform -strict -ignore-missing-schemas

      - name: Validate Kubernetes Manifests with Kubeconform
        run: |
          echo "Validating Kubernetes manifests with Kubeconform..."
          kubeconform -summary -strict -ignore-missing-schemas deploy/kubernetes/alerts/k8s-node-alerts.yaml deploy/kubernetes/alerts/slo-alerts.yaml deploy/kubernetes/secrets/ deploy/kubernetes/argocd/

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f deploy/docker-compose/docker-compose.yml config --quiet

      - name: Lint YAML & Kubernetes Manifests
        run: |
          pip install yamllint
          python3 -m yamllint .

  smoke-test:
    name: Telemetry End-to-End Smoke Test
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run End-to-End Telemetry Smoke Test
        run: bash ./scripts/smoke_test.sh

  ci-gate:
    name: CI Quality Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - docs-match-tree
      - validate-configs
      - smoke-test
    steps:
      - name: Evaluate CI Quality Gate
        run: |
          echo "========================================================"
          echo "🏁 Evaluating CI Quality Gate"
          echo "   Event: ${{ github.event_name }}"
          echo "   Code changes detected: ${{ needs.changes.outputs.code }}"
          echo "========================================================"

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "❌ Path detection failed with: ${{ needs.changes.result }}" >&2
            exit 1
          fi

          if [ "${{ needs.docs-match-tree.result }}" != "success" ]; then
            echo "❌ Documentation & Version Gate failed with: ${{ needs.docs-match-tree.result }}" >&2
            exit 1
          fi

          SHOULD_VERIFY_CODE="${{ github.event_name == 'push' || needs.changes.outputs.code == 'true' }}"
          if [ "$SHOULD_VERIFY_CODE" = "true" ]; then
            echo "🔍 Verifying code & infrastructure test suites..."
            FAILED=0

            if [ "${{ needs.validate-configs.result }}" != "success" ]; then
              echo "❌ Validate Observability Manifests, Alerts & IaC: ${{ needs.validate-configs.result }}" >&2
              FAILED=1
            else
              echo "✅ Validate Observability Manifests, Alerts & IaC: success"
            fi

            if [ "${{ needs.smoke-test.result }}" != "success" ]; then
              echo "❌ Telemetry End-to-End Smoke Test: ${{ needs.smoke-test.result }}" >&2
              FAILED=1
            else
              echo "✅ Telemetry End-to-End Smoke Test: success"
            fi

            if [ "$FAILED" -ne 0 ]; then
              echo "❌ CI Quality Gate failed." >&2
              exit 1
            fi
          else
            echo "📄 Docs-only change detected. Heavy infrastructure validation and smoke tests safely skipped."
          fi

          echo "========================================================"
          echo "✅ All CI Quality Gates successfully satisfied!"
          echo "========================================================"

